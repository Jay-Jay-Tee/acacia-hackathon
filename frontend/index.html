<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AirFrame · Airworthiness directive search</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%airframe.svg" />
    <script>
      // Apply the saved theme before first paint (see src/lib/theme.ts).
      (function () {
        var t = localStorage.getItem("adf.theme");
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
